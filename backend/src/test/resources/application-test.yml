spring:
  datasource:
    url: jdbc:h2:mem:wilderness;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

# H2 测试上下文不触发外网 NASA 同步
wilderness:
  nasa:
    enabled: false
