server:
  port: 8080

spring:
  application:
    name: wilderness-backend
  servlet:
    multipart:
      max-file-size: 10MB
      # 知识库支持一次提交一批(最多 5 个)，总请求体要能装下满批
      max-request-size: 60MB
  datasource:
    url: jdbc:mysql://localhost:3307/wilderness?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
    username: wilderness
    password: wilderness
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 500ms
  # 仅供 Actuator 健康检查探针使用：业务查询走 ElasticsearchClientConfig 手动构建的客户端
  # （用 wilderness.ai.elasticsearch.host/port，见下文），但那个 RestClient 只是方法内局部变量，
  # 没有注册成 Spring Bean；Actuator 探测不到它，会按 spring.elasticsearch.* 的默认值
  # （localhost:9200）另外自动装配一个探针专用客户端，跟业务实际连的地址不是同一个。
  # 这里显式指到同一地址，避免探针在容器里连 localhost 而报错。
  elasticsearch:
    uris: http://${wilderness.ai.elasticsearch.host}:${wilderness.ai.elasticsearch.port}
  # 邮箱验证码 SMTP（QQ/163/谷歌等按服务商填）；不配则发送接口返回 503
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:465}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

wilderness:
  auth:
    cookie-name: wilderness_session
    session-ttl: ${AUTH_SESSION_TTL:604800}
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
    code-ttl: 300
    verify-code-rate-limit: 60
    from: ${SMTP_FROM:}
    require-email-verify: false
    dev-code-log: ${AUTH_DEV_CODE_LOG:false}
    login-max-attempts: ${AUTH_LOGIN_MAX_ATTEMPTS:5}
    login-lock-seconds: ${AUTH_LOGIN_LOCK_SECONDS:900}
  ai:
    dashscope:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key: ${DASHSCOPE_API_KEY:}
      chat-model: qwen-plus
      embedding-model: text-embedding-v3
      embedding-dimensions: 1024
    elasticsearch:
      host: localhost
      port: 9200
    rag:
      index-name: wilderness-knowledge
      chunk-size: 500
      chunk-overlap: 80
      top-k: 6
      keyword-weight: 0.5
      vector-weight: 0.5
      min-score: 0.3
    web:
      max-results: 3
      max-characters: 1500
    image:
      # 天体生成 Agent 的文生图升级通道;不配则自动降级为前端 SVG 程序化渲染
      api-key: ${DASHSCOPE_IMAGE_API_KEY:}
      model: ${DASHSCOPE_IMAGE_MODEL:wanx2.1-t2i-turbo}
    langsmith:
      endpoint: https://api.smith.langchain.com
      api-key: ${LANGSMITH_API_KEY:}
      project: ${LANGSMITH_PROJECT:wilderness}
  storage:
    # 文生图产出转存本地的挂载目录；容器内对应 docker-compose 挂的 volume，
    # 本地非容器跑给相对路径默认值，方便直接起。
    generated-images-dir: ${GENERATED_IMAGES_DIR:./data/generated-images}
  history:
    # 对话历史落库总开关；关闭后不写 MySQL/ES/MQ
    enabled: ${HISTORY_ENABLED:true}
    index-name: wilderness-conversation
    rocketmq:
      # 需 RocketMQ broker；默认关闭，关闭时对话记录直写 ES 分析索引。
      # 仅当 rocketmq.name-server 存在（application-mq.yml / mq profile）且此处为 true 时才启用 MQ 链路
      enabled: ${ROCKETMQ_ENABLED:false}
      topic: conversation-topic
  nasa:
    # 权威数据落地：包内官方快照目录（resources/nasa/fact-sheet-snapshots.json）——太阳、八大行星、
    # 三颗卫星，及天狼星/参宿四、银河系/仙女座、猎户座/蟹状星云、哈雷彗星、谷神星共 8 个科普对象，
    # 按各自主源机构（NASA NSSDCA / NASA/JPL / NASA/ESA Hubble 等）如实标注。仅在对象无来源标记时应用一次，之后启动跳过。
    enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true
