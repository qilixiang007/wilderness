server:
  port: 8080

spring:
  application:
    name: wilderness-backend
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: jdbc:mysql://localhost:3307/wilderness?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
    username: wilderness
    password: wilderness
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 2000ms

wilderness:
  ai:
    dashscope:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key: ${DASHSCOPE_API_KEY:}
      chat-model: qwen-plus
      embedding-model: text-embedding-v3
      embedding-dimensions: 1024
    elasticsearch:
      host: localhost
      port: 9200
    rag:
      index-name: wilderness-knowledge
      chunk-size: 500
      chunk-overlap: 80
      top-k: 6
      keyword-weight: 0.5
      vector-weight: 0.5
      min-score: 0.3
    web:
      max-results: 3
      max-characters: 1500
    langsmith:
      endpoint: https://api.smith.langchain.com
      api-key: ${LANGSMITH_API_KEY:}
      project: ${LANGSMITH_PROJECT:wilderness}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true
