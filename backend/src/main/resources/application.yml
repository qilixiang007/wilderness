server:
  port: 8080

spring:
  application:
    name: wilderness-backend
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: jdbc:mysql://localhost:3307/wilderness?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
    username: wilderness
    password: wilderness
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 2000ms
  # 邮箱验证码 SMTP（QQ/163/谷歌等按服务商填）；不配则发送接口返回 503
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:465}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

wilderness:
  auth:
    cookie-name: wilderness_session
    session-ttl: ${AUTH_SESSION_TTL:604800}
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
    code-ttl: 300
    verify-code-rate-limit: 60
    from: ${SMTP_FROM:}
    require-email-verify: false
    dev-code-log: ${AUTH_DEV_CODE_LOG:false}
  ai:
    dashscope:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key: ${DASHSCOPE_API_KEY:}
      chat-model: qwen-plus
      embedding-model: text-embedding-v3
      embedding-dimensions: 1024
    elasticsearch:
      host: localhost
      port: 9200
    rag:
      index-name: wilderness-knowledge
      chunk-size: 500
      chunk-overlap: 80
      top-k: 6
      keyword-weight: 0.5
      vector-weight: 0.5
      min-score: 0.3
    web:
      max-results: 3
      max-characters: 1500
    image:
      # 天体生成 Agent 的文生图升级通道;不配则自动降级为前端 SVG 程序化渲染
      api-key: ${DASHSCOPE_IMAGE_API_KEY:}
      model: ${DASHSCOPE_IMAGE_MODEL:wanx2.1-t2i-turbo}
    langsmith:
      endpoint: https://api.smith.langchain.com
      api-key: ${LANGSMITH_API_KEY:}
      project: ${LANGSMITH_PROJECT:wilderness}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true
