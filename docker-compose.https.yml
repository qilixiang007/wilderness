# ============================================================
# HTTPS 叠加层 —— 叠加在 docker-compose.prod.yml 之上，证书就绪后启用
#
#   cp deploy/env.prod.example .env      # 并把 .env 里 AUTH_COOKIE_SECURE 改为 true
#   # 证书文件放到 deploy/certs/（阿里云/腾讯云控制台下载 nginx 版 .pem + .key）
#   #   deploy/certs/fullchain.pem
#   #   deploy/certs/privkey.pem
#   docker compose -f docker-compose.prod.yml -f docker-compose.https.yml up -d
#
# 效果：80 强制跳 443，443 上挂证书并终结 TLS；后端 Cookie 走 Secure。
# 回退（证书过期/出问题先撤流量）：去掉 -f docker-compose.https.yml 重启即可回 HTTP。
# ============================================================

services:
  frontend:
    ports:
      - '80:80'
      - '443:443'
    volumes:
      # 用带 TLS 的站点配置覆盖镜像内置 nginx.conf（SSE 配置保持一致）
      - ./deploy/nginx-https.conf:/etc/nginx/conf.d/default.conf:ro
      # 证书只读挂载进容器（.gitignore 已忽略 deploy/certs/，勿提交私钥）
      - ./deploy/certs:/etc/nginx/certs:ro
