# RocketMQ broker 配置（挂载进 rocketmq-broker 容器，覆盖镜像默认 broker.conf）。
# 关键项 brokerIP1：broker 向 namesrv 注册并返回给 producer 的地址（broker.conf 不支持环境变量占位，只能写死）。
# 宿主机跑后端时用 127.0.0.1（宿主机经 10911 端口映射可达）；后端也跑在容器内时，
# 需改为 broker 容器在 docker 网络中的可达地址（如宿主机 LAN IP，并同步放开防火墙 10911）。
brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
brokerIP1 = 127.0.0.1
deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH
autoCreateTopicEnable = true
