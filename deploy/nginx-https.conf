# 「宇宙是旷野」生产 HTTPS 站点配置（由 docker-compose.https.yml 挂载覆盖镜像内置配置）
# 证书路径：/etc/nginx/certs/fullchain.pem + privkey.pem（对应宿主机 deploy/certs/ 下文件）
# 若你的证书是其他文件名，改下面两行 ssl_certificate 即可。

# AI 接口粗粒度 IP 限流（兜底；精细的按用户/接口区分交给应用层 RateLimitInterceptor）
limit_req_zone $binary_remote_addr zone=ai_api:10m rate=20r/m;

# 80 → 443 强跳（开启 HTTPS 后，HTTP 明文流量一律跳走）
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # ---- TLS 证书（阿里云/腾讯云免费证书 nginx 版）----
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ---- 基础安全响应头 ----
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ---- 静态资源 + SPA history 路由回退 ----
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # ---- 后端提供 /images/*（与开发配置一致，长缓存）----
    location /images/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public";
    }

    # ---- AI 接口：比 /api/ 更具体，nginx 按最长前缀匹配自动优先命中 ----
    # limit_req 只作用于建连瞬间，不影响已建立的 SSE 长连接推送，可以放心加。
    location /api/ai/ {
        limit_req zone=ai_api burst=5 nodelay;

        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # ---- 后端 API 反代 ----
    # proxy_buffering off 必须保留：否则 /api/ai/chat/stream 的 SSE 流式
    # 问答会被 Nginx 缓冲，前端收不到逐字输出。
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 后端据 X-Forwarded-Proto 感知 https，生成正确的相对/绝对链接
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}
