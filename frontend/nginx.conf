# 「宇宙是旷野」前端 Nginx 配置
# 静态托管 Vue SPA + 反代后端 API

# AI 接口粗粒度 IP 限流（兜底；精细的按用户/接口区分交给应用层 RateLimitInterceptor）
limit_req_zone $binary_remote_addr zone=ai_api:10m rate=20r/m;

server {
    listen 80;
    server_name _;

    # 静态资源 + SPA 回退（前端路由走 history 模式）
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 图片：后端静态资源（backend/src/main/resources/static/images/），
    # 前端相对路径 /images/* 也由后端提供，故一并反代。
    location /images/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public";
    }

    # AI 接口：比 /api/ 更具体，nginx 按最长前缀匹配自动优先命中，不用关心声明顺序。
    # limit_req 只作用于建连瞬间，不影响已建立的 SSE 长连接推送，可以放心加。
    location /api/ai/ {
        limit_req zone=ai_api burst=5 nodelay;

        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # 后端反代
    # 关键点：proxy_buffering off 必须开启，否则 /api/ai/chat/stream 的
    # SSE 流式问答会被 Nginx 缓冲，前端收不到逐字输出。
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}
