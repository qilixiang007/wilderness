services:
  mysql:
    image: mysql:8.4
    container_name: wilderness-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: wilderness
      MYSQL_USER: wilderness
      MYSQL_PASSWORD: wilderness
      MYSQL_ROOT_PASSWORD: root
    ports:
      - '3307:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: wilderness-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.1
    container_name: wilderness-es
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.ml.enabled=false
      - ingest.geoip.downloader.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - '9200:9200'
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    container_name: wilderness-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment:
      # 容器内服务名互连（默认 localhost 是容器自身）
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/wilderness?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: wilderness
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-wilderness}
      SPRING_DATA_REDIS_HOST: redis
      WILDERNESS_AI_ELASTICSEARCH_HOST: elasticsearch
      # 对话历史：RocketMQ（需 broker，默认关）；关闭时直写 ES 分析索引
      # mq profile 加载 application-mq.yml（提供 rocketmq.name-server），配合 ROCKETMQ_ENABLED=true 开启 MQ 链路
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-mq}
      ROCKETMQ_NAME_SERVER: rocketmq-namesrv:9876
      WILDERNESS_HISTORY_ROCKETMQ_ENABLED: ${ROCKETMQ_ENABLED:-false}
      WILDERNESS_HISTORY_INDEX_NAME: wilderness-conversation
      # 密钥从宿主机 .env 透传,不写死在镜像里
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-wilderness}
      # 邮箱验证码 SMTP + 登录有效期
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      AUTH_SESSION_TTL: ${AUTH_SESSION_TTL:-604800}
      AUTH_DEV_CODE_LOG: ${AUTH_DEV_CODE_LOG:-false}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      GENERATED_IMAGES_DIR: /app/data/generated-images
    volumes:
      - generated-images-data:/app/data/generated-images
    ports:
      - '8080:8080'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 15s
      timeout: 5s
      retries: 8

  frontend:
    build: ./frontend
    container_name: wilderness-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '80:80'

  rocketmq-namesrv:
    image: apache/rocketmq:5.3.1
    container_name: wilderness-rocketmq-namesrv
    restart: unless-stopped
    command: sh mqnamesrv
    ports:
      - '9876:9876'

  rocketmq-broker:
    image: apache/rocketmq:5.3.1
    container_name: wilderness-rocketmq-broker
    restart: unless-stopped
    depends_on:
      - rocketmq-namesrv
    environment:
      - NAMESRV_ADDR=rocketmq-namesrv:9876
      - AUTO_CREATE_TOPIC_ENABLE=true
    volumes:
      - ./deploy/rocketmq/broker.conf:/home/rocketmq/rocketmq-5.3.1/conf/broker.conf:ro
    command: sh mqbroker -c /home/rocketmq/rocketmq-5.3.1/conf/broker.conf
    ports:
      - '10911:10911'
      - '10909:10909'
      - '10912:10912'

  prometheus:
    image: prom/prometheus:v2.54.0
    container_name: wilderness-prometheus
    restart: unless-stopped
    ports:
      - '9090:9090'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:11.1.0
    container_name: wilderness-grafana
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana

volumes:
  mysql-data:
  redis-data:
  grafana-data:
  es-data:
  generated-images-data:
